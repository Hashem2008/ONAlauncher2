# ONA Mobile Shaders - made for phones by ONA Launcher (GPL-3.0)
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
#if defined ONA_CLOUDS && SKY_QUALITY >= 3
clouds=off
#else
clouds=fast
#endif
#if defined SHADOW_ENTITIES && LIGHT_QUALITY >= 1
shadowEntities=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowBlockEntities=false
#endif
shadowTranslucent=false
frustum.culling=true
shadow.culling=true
rain.depth=false
beacon.beam.depth=false

# passes that only run when their effect is on (deferred always runs: it paints the sky)
#if LIGHT_QUALITY >= 1
program.shadow.enabled=SHADOWS
#else
program.shadow.enabled=false
#endif
#if WATER_QUALITY >= 4 && LIGHT_QUALITY >= 4
program.composite.enabled=SSR || VOLUMETRIC_LIGHT
#elif WATER_QUALITY >= 4
program.composite.enabled=SSR
#elif LIGHT_QUALITY >= 4
program.composite.enabled=VOLUMETRIC_LIGHT
#else
program.composite.enabled=false
#endif

