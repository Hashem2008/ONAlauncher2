# ONA Mobile Shaders - made for phones by ONA Launcher (GPL-3.0)
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
#ifdef ONA_CLOUDS
clouds=off
#else
clouds=fast
#endif
#ifdef SHADOW_ENTITIES
shadowEntities=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowBlockEntities=false
#endif
shadowTranslucent=false
frustum.culling=true
shadow.culling=true
rain.depth=false
beacon.beam.depth=false

# passes that only run when their effect is on (deferred always runs: it paints the sky)
program.shadow.enabled=SHADOWS
program.composite.enabled=SSR || VOLUMETRIC_LIGHT

profile.POTATO=!SHADOWS SHADOW_FILTER=0 !WAVING_PLANTS !WATER_WAVES !WATER_REFLECTIONS !WATER_DEPTH PBR=0 !BLOOM !GODRAYS !AUTO_EXPOSURE !FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=512 shadowDistance=32.0 !HANDHELD_LIGHT !ONA_CLOUDS !SHADOW_ENTITIES POM_SAMPLES=0 !RAIN_PUDDLES !WATER_FOAM !WATER_CAUSTICS !DEPTH_OF_FIELD !LENS_FLARE !CLOUD_SHADOWS !RAIN_RIPPLES !DISTANCE_HAZE !SPARKLE COLOR_GRADE=0
profile.LOW=!SHADOWS SHADOW_FILTER=0 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS !WATER_DEPTH PBR=0 !BLOOM !GODRAYS !AUTO_EXPOSURE !FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=512 shadowDistance=32.0 HANDHELD_LIGHT !ONA_CLOUDS !SHADOW_ENTITIES POM_SAMPLES=0 !RAIN_PUDDLES !WATER_FOAM !WATER_CAUSTICS !DEPTH_OF_FIELD !LENS_FLARE !CLOUD_SHADOWS !RAIN_RIPPLES !DISTANCE_HAZE !SPARKLE COLOR_GRADE=0
profile.MEDIUM=SHADOWS SHADOW_FILTER=0 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS !WATER_DEPTH PBR=1 !BLOOM !GODRAYS AUTO_EXPOSURE !FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=512 shadowDistance=48.0 HANDHELD_LIGHT !ONA_CLOUDS !SHADOW_ENTITIES POM_SAMPLES=0 !RAIN_PUDDLES !WATER_FOAM !WATER_CAUSTICS !DEPTH_OF_FIELD !LENS_FLARE !CLOUD_SHADOWS !RAIN_RIPPLES !DISTANCE_HAZE !SPARKLE COLOR_GRADE=0
profile.HIGH=SHADOWS SHADOW_FILTER=1 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=1024 shadowDistance=64.0 HANDHELD_LIGHT !ONA_CLOUDS !SHADOW_ENTITIES POM_SAMPLES=0 RAIN_PUDDLES WATER_FOAM !WATER_CAUSTICS !DEPTH_OF_FIELD !LENS_FLARE !CLOUD_SHADOWS RAIN_RIPPLES DISTANCE_HAZE !SPARKLE COLOR_GRADE=0
profile.ULTRA=SHADOWS SHADOW_FILTER=2 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM GODRAYS AUTO_EXPOSURE FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=2048 shadowDistance=96.0 HANDHELD_LIGHT ONA_CLOUDS SHADOW_ENTITIES POM_SAMPLES=0 RAIN_PUDDLES WATER_FOAM WATER_CAUSTICS !DEPTH_OF_FIELD !LENS_FLARE CLOUD_SHADOWS RAIN_RIPPLES DISTANCE_HAZE !SPARKLE COLOR_GRADE=0
profile.REALISTIC=SHADOWS SHADOW_FILTER=3 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS ATMOSPHERE WET_SURFACES VOLUMETRIC_LIGHT VL_STEPS=8 !SSAO !SSR shadowMapResolution=2048 shadowDistance=128.0 HANDHELD_LIGHT ONA_CLOUDS SHADOW_ENTITIES POM_SAMPLES=8 RAIN_PUDDLES WATER_FOAM WATER_CAUSTICS !DEPTH_OF_FIELD LENS_FLARE CLOUD_SHADOWS RAIN_RIPPLES DISTANCE_HAZE SPARKLE COLOR_GRADE=0
profile.ULTRA_REALISTIC=SHADOWS SHADOW_FILTER=3 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS ATMOSPHERE WET_SURFACES VOLUMETRIC_LIGHT VL_STEPS=12 SSAO SSAO_SAMPLES=8 SSR SSR_STEPS=16 shadowMapResolution=3072 shadowDistance=160.0 HANDHELD_LIGHT ONA_CLOUDS SHADOW_ENTITIES POM_SAMPLES=16 RAIN_PUDDLES WATER_FOAM WATER_CAUSTICS !DEPTH_OF_FIELD LENS_FLARE CLOUD_SHADOWS RAIN_RIPPLES DISTANCE_HAZE SPARKLE COLOR_GRADE=0
profile.IMPOSSIBLE=SHADOWS SHADOW_FILTER=3 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS ATMOSPHERE WET_SURFACES VOLUMETRIC_LIGHT VL_STEPS=16 SSAO SSAO_SAMPLES=16 SSR SSR_STEPS=32 shadowMapResolution=4096 shadowDistance=192.0 HANDHELD_LIGHT ONA_CLOUDS SHADOW_ENTITIES POM_SAMPLES=24 RAIN_PUDDLES WATER_FOAM WATER_CAUSTICS !DEPTH_OF_FIELD LENS_FLARE CLOUD_SHADOWS RAIN_RIPPLES DISTANCE_HAZE SPARKLE COLOR_GRADE=0

screen=<profile> <empty> [LIGHT] [WATER] [WORLD] [SKY] [MOTION] [LOOK]
screen.LIGHT=SHADOWS SHADOW_FILTER shadowMapResolution shadowDistance SHADOW_ENTITIES SUN_STRENGTH AUTO_EXPOSURE HANDHELD_LIGHT VOLUMETRIC_LIGHT VL_STEPS
screen.WATER=WATER_WAVES WATER_WAVE_SPEED WATER_WAVE_SIZE WATER_REFLECTIONS WATER_DEPTH SSR SSR_STEPS WATER_FOAM WATER_CAUSTICS RAIN_RIPPLES
screen.WORLD=PBR NORMAL_STRENGTH SPECULAR_STRENGTH POM_SAMPLES POM_DEPTH FOLIAGE_SSS WET_SURFACES RAIN_PUDDLES SPARKLE SSAO SSAO_SAMPLES
screen.SKY=ATMOSPHERE ONA_CLOUDS CLOUD_SHADOWS SUN_HALO GODRAYS DISTANCE_HAZE FOG_START
screen.MOTION=WAVING_PLANTS WIND_STRENGTH
screen.LOOK=BLOOM EXPOSURE CONTRAST SATURATION WARMTH VIGNETTE_FX FILM_GRAIN CHROMATIC COLOR_GRADE DEPTH_OF_FIELD DOF_STRENGTH LENS_FLARE
sliders=COLOR_GRADE DOF_STRENGTH SHADOW_FILTER shadowMapResolution shadowDistance SUN_STRENGTH PBR SATURATION FOG_START VL_STEPS SSAO_SAMPLES SSR_STEPS POM_SAMPLES POM_DEPTH NORMAL_STRENGTH SPECULAR_STRENGTH WIND_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SIZE SUN_HALO EXPOSURE CONTRAST WARMTH
