# ONA Mobile Shaders - made for phones by ONA Launcher (GPL-3.0)
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=fast
shadowTranslucent=false
frustum.culling=true
shadow.culling=true
rain.depth=false
beacon.beam.depth=false

# passes that only run when their effect is on (the low levels draw the world once, nothing more)
program.shadow.enabled=SHADOWS
program.deferred.enabled=SSAO
program.composite.enabled=SSR || VOLUMETRIC_LIGHT

profile.POTATO=!SHADOWS SHADOW_FILTER=0 !WAVING_PLANTS !WATER_WAVES !WATER_REFLECTIONS !WATER_DEPTH PBR=0 !BLOOM !GODRAYS !AUTO_EXPOSURE !FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=512 shadowDistance=32.0
profile.LOW=!SHADOWS SHADOW_FILTER=0 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS !WATER_DEPTH PBR=0 !BLOOM !GODRAYS !AUTO_EXPOSURE !FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=512 shadowDistance=32.0
profile.MEDIUM=SHADOWS SHADOW_FILTER=0 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS !WATER_DEPTH PBR=1 !BLOOM !GODRAYS AUTO_EXPOSURE !FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=512 shadowDistance=48.0
profile.HIGH=SHADOWS SHADOW_FILTER=1 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=1024 shadowDistance=64.0
profile.ULTRA=SHADOWS SHADOW_FILTER=2 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM GODRAYS AUTO_EXPOSURE FOLIAGE_SSS !ATMOSPHERE !WET_SURFACES !VOLUMETRIC_LIGHT !SSAO !SSR shadowMapResolution=2048 shadowDistance=96.0
profile.REALISTIC=SHADOWS SHADOW_FILTER=3 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS ATMOSPHERE WET_SURFACES VOLUMETRIC_LIGHT VL_STEPS=8 !SSAO !SSR shadowMapResolution=2048 shadowDistance=128.0
profile.ULTRA_REALISTIC=SHADOWS SHADOW_FILTER=3 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS ATMOSPHERE WET_SURFACES VOLUMETRIC_LIGHT VL_STEPS=12 SSAO SSAO_SAMPLES=8 SSR SSR_STEPS=16 shadowMapResolution=3072 shadowDistance=160.0
profile.IMPOSSIBLE=SHADOWS SHADOW_FILTER=3 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS WATER_DEPTH PBR=2 BLOOM !GODRAYS AUTO_EXPOSURE FOLIAGE_SSS ATMOSPHERE WET_SURFACES VOLUMETRIC_LIGHT VL_STEPS=16 SSAO SSAO_SAMPLES=16 SSR SSR_STEPS=32 shadowMapResolution=4096 shadowDistance=192.0

screen=<profile> <empty> [LIGHT] [WATER] [WORLD] [LOOK]
screen.LIGHT=SHADOWS SHADOW_FILTER shadowMapResolution shadowDistance SUN_STRENGTH AUTO_EXPOSURE VOLUMETRIC_LIGHT VL_STEPS
screen.WATER=WATER_WAVES WATER_REFLECTIONS WATER_DEPTH SSR SSR_STEPS
screen.WORLD=PBR WAVING_PLANTS FOLIAGE_SSS WET_SURFACES SSAO SSAO_SAMPLES
screen.LOOK=ATMOSPHERE BLOOM GODRAYS SATURATION FOG_START
sliders=SHADOW_FILTER shadowMapResolution shadowDistance SUN_STRENGTH PBR SATURATION FOG_START VL_STEPS SSAO_SAMPLES SSR_STEPS
