# ONA Mobile Shaders - made for phones by ONA Launcher (GPL-3.0)
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=fast
shadowTranslucent=false
frustum.culling=true
shadow.culling=true
rain.depth=false
beacon.beam.depth=false

# no shadow pass at all when shadows are off (POTATO, LOW)
program.shadow.enabled=SHADOWS

profile.POTATO=!SHADOWS SHADOW_FILTER=0 !WAVING_PLANTS !WATER_WAVES !WATER_REFLECTIONS PBR=0 !BLOOM !GODRAYS shadowMapResolution=512 shadowDistance=32.0
profile.LOW=!SHADOWS SHADOW_FILTER=0 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS PBR=0 !BLOOM !GODRAYS shadowMapResolution=512 shadowDistance=32.0
profile.MEDIUM=SHADOWS SHADOW_FILTER=0 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS PBR=1 !BLOOM !GODRAYS shadowMapResolution=512 shadowDistance=48.0
profile.HIGH=SHADOWS SHADOW_FILTER=1 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS PBR=2 BLOOM !GODRAYS shadowMapResolution=1024 shadowDistance=64.0
profile.ULTRA=SHADOWS SHADOW_FILTER=2 WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS PBR=2 BLOOM GODRAYS shadowMapResolution=2048 shadowDistance=96.0

screen=<profile> <empty> [LIGHT] [WATER] [LOOK]
screen.LIGHT=SHADOWS SHADOW_FILTER shadowMapResolution shadowDistance SUN_STRENGTH PBR
screen.WATER=WATER_WAVES WATER_REFLECTIONS WAVING_PLANTS
screen.LOOK=BLOOM GODRAYS SATURATION FOG_START
sliders=SHADOW_FILTER shadowMapResolution shadowDistance SUN_STRENGTH PBR SATURATION FOG_START
