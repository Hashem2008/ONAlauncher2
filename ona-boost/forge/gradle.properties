mod_description=Made for phones by ONA Launcher: keeps the game smooth by itself. When the FPS falls under the target it makes the least visible settings lighter one by one (particles, shadows of mobs, clouds, Fabulous graphics, entity distance, render and simulation distance, leaves), and gives them back when the FPS is high again. Your own settings always come back. Works with Embeddium, Oculus and other mods.
