plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
    id 'net.minecraftforge.renamer' version '1.1.8+' // Minecraft 1.20.1 runs on SRG names
}

version = mod_version
group = mod_group_id
base.archivesName = "ona-boost-forge-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        // the loader independent part, shared with the Fabric build
        java.srcDir '../common/src/main/java'
    }
}

minecraft {
    mappings channel: mapping_channel, version: minecraft_version
}

repositories {
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
    from('../../LICENSE') {
        rename { 'LICENSE_ona_boost' }
    }
    archiveClassifier = 'unobfuscated'
}

renamer.mappings.from minecraft.dependency.toSrgFile

// renameJar: the jar with SRG names that Forge 1.20.1 loads, ona-boost-forge-1.20.1-<version>.jar
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = ''
}

tasks.named('build') {
    dependsOn 'renameJar'
}
