pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		// Google's copy of Maven Central first: Maven Central answers 429 to busy shared networks
		maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'ona-boost-fabric'
