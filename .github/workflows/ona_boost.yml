# ONA Boost: ONA's own FPS mod for phones (ona-boost/), built for Fabric 26.x and Forge 1.20.1 and
# published to the "ona-boost" release, where ONA Launcher downloads it from.
name: ONA Boost

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'ona-boost/**'
      - '.github/workflows/ona_boost.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - name: Build for Fabric 26.x
        working-directory: ona-boost/fabric
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew build --no-daemon

      - name: Build for Forge 1.20.1
        working-directory: ona-boost/forge
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew build --no-daemon

      - name: Publish to the ona-boost release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=ona-boost
          files=$(ls ona-boost/fabric/build/libs/ona-boost-fabric-*.jar ona-boost/forge/build/libs/ona-boost-forge-*.jar | grep -v -e sources -e unobfuscated)
          echo "$files"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "ONA Boost" --notes "ONA's FPS mod for phones (Fabric 26.x, Forge 1.20.1). ONA Launcher installs it by itself."
          gh release upload "$tag" $files --repo "$GITHUB_REPOSITORY" --clobber
