name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      # ONA: which APKs to build, a JSON list (every push builds arm64 only to save Actions minutes)
      arches:
        required: false
        type: string
        default: '["arm64", "arm", "x86_64", "performance"]'
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # ONA: contents write publishes the debug APK as the ona-latest release
    permissions:
      contents: write
      actions: write
    strategy:
      matrix:
        # ONA: one APK per CPU type instead of a 446 MB "all" APK nobody needs whole:
        # arm64 = almost every phone, arm = old 32-bit phones, x86_64 = emulators / PCs
        arch: ${{ fromJSON(inputs.arches || '["arm64", "arm", "x86_64", "performance"]') }}
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # ONA: the CPU type of this job, so every APK gets the same native extras (user rule)
      - name: Native ABI of this APK
        id: abi
        run: |
          case "${{ matrix.arch }}" in
            arm64|performance)  echo "abi=arm64-v8a" >> "$GITHUB_OUTPUT"; echo "physx=libPhysXJniBindings_64.so" >> "$GITHUB_OUTPUT" ;;
            arm)    echo "abi=armeabi-v7a" >> "$GITHUB_OUTPUT"; echo "physx=libPhysXJniBindings_32.so" >> "$GITHUB_OUTPUT" ;;
            x86_64) echo "abi=x86_64" >> "$GITHUB_OUTPUT"; echo "physx=libPhysXJniBindings_64.so" >> "$GITHUB_OUTPUT" ;;
            x86)    echo "abi=x86" >> "$GITHUB_OUTPUT"; echo "physx=libPhysXJniBindings_32.so" >> "$GITHUB_OUTPUT" ;;
            *)      echo "abi=" >> "$GITHUB_OUTPUT" ;;
          esac

      # ONA: PhysX 4.1 + physx-jni 1.1.0 glue compiled for this CPU, so Physics Mod (1.18.2) runs
      - name: Cache PhysX 4.1 Android port
        if: steps.abi.outputs.abi != ''
        id: physx-cache
        uses: actions/cache@v4
        with:
          path: ZalithLauncher/src/main/jniLibs/${{ steps.abi.outputs.abi }}/${{ steps.abi.outputs.physx }}
          key: physx4-jni-android-${{ steps.abi.outputs.abi }}-${{ hashFiles('tools/physx4-android/build.sh') }}

      - name: Build PhysX 4.1 Android port (physx-jni 1.1.0, ${{ steps.abi.outputs.abi }})
        if: steps.abi.outputs.abi != '' && steps.physx-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          # The project's NDK (r25, clang 14) is closer to what PhysX 4.1 was written for
          ndk25="$ANDROID_HOME/ndk/25.2.9519653"
          sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ ! -f "$ndk25/source.properties" ] && [ -n "$sdkm" ]; then
            yes | "$sdkm" --install "ndk;25.2.9519653" > /dev/null || true
          fi
          if [ -f "$ndk25/source.properties" ]; then export ANDROID_NDK_HOME="$ndk25"; fi
          echo "PhysX port uses NDK $ANDROID_NDK_HOME"
          bash tools/physx4-android/build.sh "$RUNNER_TEMP/physx4" \
            "ZalithLauncher/src/main/jniLibs/${{ steps.abi.outputs.abi }}/${{ steps.abi.outputs.physx }}" \
            "${{ steps.abi.outputs.abi }}" || {
            echo "::warning::PhysX port for ${{ steps.abi.outputs.abi }} was not built (see this step)"
            exit 1
          }

      # ONA: LWJGL's zstd binding for this CPU. Voxy bundles lwjgl-zstd with desktop natives only, so
      # its LOD storage failed on phones ("Failed to locate library: liblwjgl_zstd.so").
      - name: Cache LWJGL zstd Android port
        if: steps.abi.outputs.abi != ''
        id: zstd-cache
        uses: actions/cache@v4
        with:
          path: ZalithLauncher/src/main/jniLibs/${{ steps.abi.outputs.abi }}/liblwjgl_zstd.so
          key: lwjgl-zstd-android-${{ steps.abi.outputs.abi }}-${{ hashFiles('tools/lwjgl-zstd-android/build.sh') }}

      - name: Build LWJGL zstd binding (liblwjgl_zstd.so, ${{ steps.abi.outputs.abi }})
        if: steps.abi.outputs.abi != '' && steps.zstd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          bash tools/lwjgl-zstd-android/build.sh "$RUNNER_TEMP/lwjgl-zstd" \
            "ZalithLauncher/src/main/jniLibs/${{ steps.abi.outputs.abi }}/liblwjgl_zstd.so" \
            "${{ steps.abi.outputs.abi }}" || {
            echo "::warning::liblwjgl_zstd.so for ${{ steps.abi.outputs.abi }} was not built, Voxy keeps failing there (see this step)"
            exit 1
          }

      # ONA: the Horizon (Rust) engine, built once by horizon.yml and published as a release of
      # this repository. Without it the APK still builds; the Rust switch then says so.
      - name: Add Horizon (Rust) engine
        if: matrix.arch == 'arm64'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(sed -n 's/^  HORIZON_COMMIT: //p' .github/workflows/horizon.yml)
          tag="horizon-${commit:0:12}"
          dir="$RUNNER_TEMP/horizon"
          mkdir -p "$dir"
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p horizon-android-libs.zip -D "$dir"; then
            unzip -q -o "$dir/horizon-android-libs.zip" -d "$dir/x"
            mkdir -p ZalithLauncher/src/main/jniLibs/arm64-v8a ZalithLauncher/src/main/assets
            cp "$dir"/x/jniLibs/arm64-v8a/*.so ZalithLauncher/src/main/jniLibs/arm64-v8a/
            cp "$dir/x/assets/horizon.zip" ZalithLauncher/src/main/assets/
            cp "$dir/x/HORIZON_LICENSE.txt" "$dir/x/HORIZON_THIRD_PARTY_NOTICES.md" ZalithLauncher/src/main/assets/ || true
            echo "Horizon engine $tag added"
          else
            echo "::warning::Horizon engine release $tag not found; this APK has no Rust engine"
          fi

      # ONA: LWJGL/*/src changes only reach the game when the merged jars in assets are rebuilt
      - name: Check LWJGL jars carry the ONA patches
        run: |
          for v in 3.3.3 3.4.1; do
            jar="ZalithLauncher/src/main/assets/app_runtime/lwjgl/$v/lwjgl-$v-merged-modules.jar"
            if unzip -p "$jar" org/lwjgl/opengl/PojavRendererInit.class | grep -a -q glShaderSource; then
              echo "LWJGL $v: GL format fix + shader output fix inside"
            else
              echo "::warning::LWJGL $v merged jar lacks the newest PojavRendererInit (rebuild the jar)"
            fi
          done

      # ONA Performance downloads its Java and LWJGL from this release: keep it in step with the
      # files the normal APKs carry (assets/runtimes/jre-*, assets/app_runtime/lwjgl + natives AARs)
      - name: Publish downloads for ONA Performance
        if: matrix.arch == 'arm64' || matrix.arch == 'performance'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=ona-runtimes
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Downloads for ONA Performance" \
              --notes "Java 8 / 17 / 21 / 25 and LWJGL packs for Android (the files the normal APKs carry). ONA Performance downloads the ones a version needs." || true
          published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true)
          dir="$RUNNER_TEMP/ona-downloads"; mkdir -p "$dir"
          for jre in jre-8 jre-17 jre-21 jre-25; do
            src="ZalithLauncher/src/main/assets/runtimes/$jre"
            [ -f "$src/version" ] || continue
            online=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$jre-version" 2>/dev/null || true)
            if [ "$online" = "$(cat "$src/version")" ]; then echo "$jre up to date"; continue; fi
            files=()
            for f in "$src"/*; do cp "$f" "$dir/$jre-$(basename "$f")"; files+=("$dir/$jre-$(basename "$f")"); done
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber && echo "$jre published"
          done
          # LWJGL: same name as build.gradle.kts lwjglPackName(): jars version + natives AAR sha1
          for v in 3.3.3 3.4.1; do
            src="ZalithLauncher/src/main/assets/app_runtime/lwjgl/$v"
            aar="ZalithLauncher/libs/lwjgl-$v-natives-release.aar"
            [ -f "$src/version" ] && [ -f "$aar" ] || continue
            jars=$(tr -d '[:space:]' < "$src/version"); natives=$(sha1sum "$aar" | cut -c1-8)
            name="lwjgl-$v-arm64-v8a-${jars:0:12}-$natives.zip"
            if echo "$published" | grep -qx "$name"; then echo "$name up to date"; continue; fi
            work="$dir/lwjgl-$v"; mkdir -p "$work/natives/arm64-v8a"
            cp -r "$src"/. "$work"/
            unzip -q -o "$aar" "assets/app_runtime/lwjgl/$v/natives/arm64-v8a/*" -d "$dir/aar-$v"
            cp "$dir/aar-$v/assets/app_runtime/lwjgl/$v/natives/arm64-v8a/"* "$work/natives/arm64-v8a/"
            (cd "$work" && zip -q -r -X "$dir/$name" .)
            ls -la "$dir/$name"
            gh release upload "$tag" "$dir/$name" --repo "$GITHUB_REPOSITORY" --clobber && echo "$name published"
          done

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          if [ "${{ matrix.arch }}" = "performance" ]; then
            # small and light: no Java inside (downloaded on demand), no Rust engine, R8 shrunk
            ./gradlew ZalithLauncher:assembleRelease -Darch=arm64 -Dlite=true
          else
            ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}
          fi

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      # ONA: no debug APK artifact any more. A private repo on the free plan has ~500 MB of
      # artifact storage and one build is ~650 MB, so the upload always failed (red
      # "Failed to CreateArtifact"). Release files do not count: main goes to ona-latest, any
      # other branch (for example restore-<commit>, to get an old build back) to ona-<branch>.
      - name: Publish Debug APK to a release
        if: inputs.variant == 'Debug'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tag=ona-latest; else tag="ona-$branch"; fi
          apk=$(ls ZalithLauncher/build/outputs/apk/debug/*.apk ZalithLauncher/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          case "${{ matrix.arch }}" in
            arm64)  name="ONA-arm64-v8a_64bit-phones.apk"
                    who="64-bit phones and tablets from about 2017 on: Snapdragon, Exynos, MediaTek Dimensity and Helio, Kirin, Google Tensor, Unisoc T6xx/T7xx - احسن خيار لأغلب الجوالات (فيه محرك Rust)" ;;
            arm)    name="ONA-armeabi-v7a_32bit-old-phones.apk"
                    who="old or cheap phones with a 32-bit Android (Android Go, Snapdragon 4xx, Helio A/P2x, Unisoc SC9863) - للجوالات القديمة اللي نظامها 32 بت" ;;
            performance) name="ONA-Performance_arm64-light.apk"
                    who="ONA Performance: small and light, for 64-bit phones. Java comes down once on the first launch of a version, no Rust engine - نسخة خفيفة وصغيرة، الجافا بتنزل أول مرة تلعب"
                    ;;
            x86_64) name="ONA-x86_64_emulators-PC.apk"
                    who="Android emulators and PCs (BlueStacks, LDPlayer, Waydroid, Chromebooks with Intel/AMD) - للمحاكيات والكمبيوتر" ;;
            *)      name="ONA-${{ matrix.arch }}.apk"; who="${{ matrix.arch }}" ;;
          esac
          out="$RUNNER_TEMP/$name"
          cp "$apk" "$out"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Debug build of $GITHUB_REF_NAME ($GITHUB_SHA)."
            echo ""
            cat tools/ci/APK_GUIDE.md
          } > "$notes"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "ONA debug build ($GITHUB_REF_NAME)" --notes-file "$notes" || true
          gh release upload "$tag" "$out" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" || true
          # Older single names in this release are replaced by the per-CPU files (see DELETED_BUILDS.txt)
          for old in ONA-debug-all.apk ONA-debug-arm64.apk; do
            gh release delete-asset "$tag" "$old" --repo "$GITHUB_REPOSITORY" -y > /dev/null 2>&1 || true
          done
          # The build page shows no Artifacts any more: put the download link on it instead
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
          {
            echo "### APK (${{ matrix.arch }}) - تحميل التطبيق"
            echo ""
            echo "[$name]($url)"
            echo ""
            echo "$who"
            echo ""
            echo "Release page: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"

      # ONA: the arm64 APK (~246 MB) also on this build page, as the user wants it there. Free
      # private storage is ~500 MB, so only the newest one is kept: older ones are deleted first
      # and listed in this build's summary (run + commit, to rebuild one: push the commit to
      # restore-<commit7>). The other CPU types (arm, x86_64) stay in the release only.
      - name: Remove the previous APK from older build pages
        if: inputs.variant == 'Debug' && matrix.arch == 'arm64'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ONA-debug-arm64&per_page=100" \
            --jq '.artifacts[] | select(.expired|not) | "\(.id) \(.workflow_run.id) \(.workflow_run.head_sha[0:7]) \(.created_at)"')
          [ -z "$old" ] && exit 0
          echo "### Older APKs removed from build pages (still rebuildable from their commit)" >> "$GITHUB_STEP_SUMMARY"
          echo "$old" | while read -r id run sha date; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && \
              echo "- run $run, commit $sha, $date" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK to this build page (arm64)
        if: inputs.variant == 'Debug' && matrix.arch == 'arm64'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ONA-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          retention-days: 7
          compression-level: 0
